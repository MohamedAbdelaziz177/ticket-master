databaseChangeLog:
  - changeSet:
      id: 1794944182000-1
      author: abdelaziz26
      changes:
        - sql:
            sql: CREATE SCHEMA IF NOT EXISTS events
      rollback:
        - sql:
            sql: DROP SCHEMA IF EXISTS events
  - changeSet:
      id: 1794944182000-2
      author: abdelaziz26
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      comment: >-
        The JPA entities Venue, Event, Seat and EventSeat declare schema "events".
        Move the existing tables out of the default schema so hibernate
        ddl-auto=validate matches the mappings. Associated indexes, constraints
        and identity sequences owned by the tables move with them, so the
        foreign keys between them stay valid.
      changes:
        - sql:
            sql: ALTER TABLE public.venues SET SCHEMA events
        - sql:
            sql: ALTER TABLE public.events SET SCHEMA events
        - sql:
            sql: ALTER TABLE public.seats SET SCHEMA events
        - sql:
            sql: ALTER TABLE public.event_seats SET SCHEMA events
      rollback:
        - sql:
            sql: ALTER TABLE events.event_seats SET SCHEMA public
        - sql:
            sql: ALTER TABLE events.seats SET SCHEMA public
        - sql:
            sql: ALTER TABLE events.events SET SCHEMA public
        - sql:
            sql: ALTER TABLE events.venues SET SCHEMA public
