server:
  port: 9070
spring:
  application:
    name: search-service
  datasource:
    url: jdbc:postgresql://localhost:5432/ticket-master
    username: admin
    password: 1234

  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
    connection-timeout: ${ELASTICSEARCH_CONNECTION_TIMEOUT:1s}
    socket-timeout: ${ELASTICSEARCH_SOCKET_TIMEOUT:5s}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
