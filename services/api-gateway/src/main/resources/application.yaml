spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
              lower-case-service-id: true
    circuitbreaker:
      resilience4j:
              enableSemaphoreDefaultBulkhead: true


eureka:
  client:
    register-with-eureka: false
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true

server:
  port: 8070